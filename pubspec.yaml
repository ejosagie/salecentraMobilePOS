name: salecentra_wave
description: SaleCentra Flutter - Smart Sales & Business Management
publish_to: 'none'
version: 1.2.0+37

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^23.2.4
  provider: ^6.1.1
  uuid: ^4.2.1
  crypto: ^3.0.3
  http: ^1.1.0
  http_parser: ^4.0.2
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  permission_handler: ^11.0.1
  image_picker: ^1.0.4
  flutter_slidable: ^3.0.1
  badges: ^3.1.2
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  pdf: ^3.10.7
  printing: ^5.11.1
  change_app_package_name: ^1.5.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
